services:
  hockeylan-postgres:
    ports: !reset []
    restart: always

  hockeylan-backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: hockeylan-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?DB_NAME must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      QR_BASE_URL: ${QR_BASE_URL:?QR_BASE_URL must be set}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      ADMIN_SESSION_TIMEOUT: ${ADMIN_SESSION_TIMEOUT:-30m}
      MAX_JSON_PAYLOAD_BYTES: ${MAX_JSON_PAYLOAD_BYTES:-65536}
    restart: always

  hockeylan-frontend:
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    build:
      args:
        VITE_API_BASE_URL: /api
    restart: always
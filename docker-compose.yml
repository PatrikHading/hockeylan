services:
  hockeylan-postgres:
    image: postgres:17.10-alpine3.24
    container_name: hockeylan-postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-hockeylan}
      POSTGRES_USER: ${DB_USERNAME:-hockeylan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - hockeylan-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-hockeylan} -d ${DB_NAME:-hockeylan}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  hockeylan-backend:
    container_name: hockeylan-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: hockeylan-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hockeylan}
      DB_USERNAME: ${DB_USERNAME:-hockeylan}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      QR_BASE_URL: ${QR_BASE_URL:-http://localhost:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    depends_on:
      hockeylan-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/api/equipment/types || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  hockeylan-frontend:
    container_name: hockeylan-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      hockeylan-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health | grep -q '^ok$'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  hockeylan-postgres-data:
    name: hockeylan-postgres-data
map $http_x_forwarded_proto $hockeylan_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_x_forwarded_port $hockeylan_forwarded_port {
    ""      $server_port;
    default $http_x_forwarded_port;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 64k;

    include /etc/nginx/conf.d/security-headers.conf;

    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;

        proxy_pass http://hockeylan-backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $hockeylan_forwarded_port;
        proxy_set_header X-Forwarded-Proto $hockeylan_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_buffering off;
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/conf.d/security-headers.conf;

        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
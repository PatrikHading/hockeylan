spring.config.import=optional:file:.env[.properties]
spring.application.name=hockeylan

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hockeylan}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
app.qr.base-url=${QR_BASE_URL:http://localhost:5173}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.capacity=${RATE_LIMIT_CAPACITY:60}
app.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:60}
app.rate-limit.refill-period-seconds=${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}

app.seed.enabled=false

app.request.max-json-payload-bytes=${MAX_JSON_PAYLOAD_BYTES:1048576}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.max-http-request-header-size=8KB
spring.config.import=optional:file:.env[.properties]

spring.application.name=hockeylan

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hockeylan}
spring.datasource.username=${DB_USERNAME:hockeylan}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.qr.base-url=${QR_BASE_URL:http://localhost:5173}

app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

app.rate-limit.api-capacity=${RATE_LIMIT_API_CAPACITY:120}
app.rate-limit.api-refill-tokens=${RATE_LIMIT_API_REFILL_TOKENS:120}
app.rate-limit.api-refill-period-seconds=${RATE_LIMIT_API_REFILL_PERIOD_SECONDS:60}

app.rate-limit.login-capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login-refill-tokens=${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
app.rate-limit.login-refill-period-seconds=${RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS:300}

app.rate-limit.idle-entry-ttl-seconds=${RATE_LIMIT_IDLE_ENTRY_TTL_SECONDS:900}
app.rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:10000}

app.seed.enabled=false

app.request.max-json-payload-bytes=${MAX_JSON_PAYLOAD_BYTES:65536}

spring.jackson.deserialization.fail-on-unknown-properties=true

server.max-http-request-header-size=8KB

server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=${ADMIN_SESSION_TIMEOUT:30m}

app.admin-bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin-bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin-bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
services:
  hockeylan-postgres:
    image: postgres:17.10-alpine3.24
    container_name: hockeylan-postgres
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-hockeylan}
      POSTGRES_USER: ${DB_USERNAME:-hockeylan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - hockeylan-postgres-data:/var/lib/postgresql/data
    networks:
      - hockeylan-internal
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-hockeylan} -d ${DB_NAME:-hockeylan}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  hockeylan-backend:
    container_name: hockeylan-backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: hockeylan-postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hockeylan}
      DB_USERNAME: ${DB_USERNAME:-hockeylan}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      QR_BASE_URL: ${QR_BASE_URL:-http://localhost:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_API_CAPACITY: ${RATE_LIMIT_API_CAPACITY:-120}
      RATE_LIMIT_API_REFILL_TOKENS: ${RATE_LIMIT_API_REFILL_TOKENS:-120}
      RATE_LIMIT_API_REFILL_PERIOD_SECONDS: ${RATE_LIMIT_API_REFILL_PERIOD_SECONDS:-60}
      RATE_LIMIT_LOGIN_CAPACITY: ${RATE_LIMIT_LOGIN_CAPACITY:-5}
      RATE_LIMIT_LOGIN_REFILL_TOKENS: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:-5}
      RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS: ${RATE_LIMIT_LOGIN_REFILL_PERIOD_SECONDS:-300}
      RATE_LIMIT_IDLE_ENTRY_TTL_SECONDS: ${RATE_LIMIT_IDLE_ENTRY_TTL_SECONDS:-900}
      RATE_LIMIT_MAX_ENTRIES: ${RATE_LIMIT_MAX_ENTRIES:-10000}
      ADMIN_SESSION_TIMEOUT: ${ADMIN_SESSION_TIMEOUT:-30m}
      MAX_JSON_PAYLOAD_BYTES: ${MAX_JSON_PAYLOAD_BYTES:-65536}
    depends_on:
      hockeylan-postgres:
        condition: service_healthy
    networks:
      - hockeylan-internal
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/api/equipment/types || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  hockeylan-frontend:
    container_name: hockeylan-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      hockeylan-backend:
        condition: service_healthy
    networks:
      - hockeylan-internal
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/health | grep -q '^ok$'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  hockeylan-internal:
    name: hockeylan-internal
    driver: bridge

volumes:
  hockeylan-postgres-data:
    name: hockeylan-postgres-data